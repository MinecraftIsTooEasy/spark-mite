name: Release on tag

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Cache MITE runtime JAR
        run: |
          set -euo pipefail
          MITE_VERSION='1.6.4-MITE'
          CACHE_DIR="${GRADLE_USER_HOME:-$HOME/.gradle}/caches/fml-loom/$MITE_VERSION"
          TARGET_JAR="$CACHE_DIR/$MITE_VERSION.jar"

          mkdir -p "$CACHE_DIR"
          if [ ! -f "$TARGET_JAR" ]; then
            curl -fSL \
              "https://maven.limingzxc.top/repository/maven-releases/com/mojang/minecraft/$MITE_VERSION/minecraft-$MITE_VERSION.jar" \
              -o "$TARGET_JAR.tmp"
            mv "$TARGET_JAR.tmp" "$TARGET_JAR"
          fi

      - name: Build release JAR
        run: ./gradlew :spark-mite:build --no-daemon

      - name: Collect release artifact
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          find spark-mite/build/libs -maxdepth 1 -type f -name 'spark-mite-*.jar' \
            ! -name '*-dev.jar' ! -name '*-sources.jar' \
            -exec cp {} release-artifacts/ \;
          test "$(find release-artifacts -type f | wc -l)" -eq 1

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1.14.0
        with:
          artifacts: release-artifacts/*.jar
          generateReleaseNotes: true
